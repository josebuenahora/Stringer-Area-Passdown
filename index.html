<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stringer Department Heat Map</title>
<style>:root{--bg:#0b1220;--panel:#111b2e;--card:#17243a;--text:#eef4ff;--muted:#9eabc0;--border:#31415b;--normal:#198754;--attention:#e5b700;--high:#e87512;--critical:#cf3037;--nodata:#7e8998;--accent:#3b82f6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}header{padding:20px 22px 10px}h1{margin:0;font-size:24px}.sub{color:var(--muted);margin-top:5px;font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;padding:12px 22px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field select{min-height:42px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:0 10px;font-size:15px}button{min-height:42px;border:1px solid var(--border);border-radius:8px;padding:0 14px;background:var(--card);color:var(--text);font-weight:700;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent)}.legend{padding:0 22px 12px;display:flex;gap:15px;flex-wrap:wrap;color:var(--muted);font-size:13px}.info{margin:0 22px 12px;padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:var(--panel)}.mapwrap{margin:0 22px 24px;overflow:auto;border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:10px}svg{display:block;min-width:2300px;width:100%;height:auto}.equip{cursor:pointer}.equip.selected{stroke:#fff;stroke-width:5}@media(max-width:600px){header,.toolbar,.legend{padding-left:12px;padding-right:12px}.info,.mapwrap{margin-left:12px;margin-right:12px}}</style></head><body>
<header><h1>STRINGER DEPARTMENT — HEAT MAP</h1><div class="sub">Lines 5 & 6 • independent Stringer A/B status • local browser storage</div></header>
<div class="toolbar"><div class="field"><label>Line</label><select id="line"><option>6</option><option>5</option></select></div><div class="field"><label>Row</label><select id="row"><option value="upper">Upper · 7–12</option><option value="lower">Lower · 1–6</option></select></div><div class="field"><label>Equipment</label><select id="equipment"></select></div><div class="field"><label>Status</label><select id="status"><option value="normal">🟢 Normal</option><option value="attention">🟡 Attention</option><option value="high">🟠 High</option><option value="critical">🔴 Critical</option><option value="nodata">⚪ No Data</option></select></div><button class="primary" id="apply">Apply status</button><button id="reset">Reset all</button></div>
<div class="legend"><span>🟢 Normal</span><span>🟡 Attention</span><span>🟠 High</span><span>🔴 Critical</span><span>⚪ No Data</span><span>Click any equipment block to select it.</span></div><div class="info" id="info"></div><div class="mapwrap"><svg viewBox="0 0 2940 1110"><g id="map"></g></svg></div>
<script>(()=>{const NS='http://www.w3.org/2000/svg',map=document.getElementById('map'),line=document.getElementById('line'),row=document.getElementById('row'),eq=document.getElementById('equipment'),status=document.getElementById('status'),info=document.getElementById('info');const colors={normal:'#198754',attention:'#e5b700',high:'#e87512',critical:'#cf3037',nodata:'#7e8998'},rows=[{l:6,r:'upper',nums:[7,8,9,10,11,12],y:35},{l:6,r:'lower',nums:[1,2,3,4,5,6],y:265},{l:5,r:'upper',nums:[7,8,9,10,11,12],y:580},{l:5,r:'lower',nums:[1,2,3,4,5,6],y:810}],K=(l,r,e)=>`L${l}|${r}|${e}`,equipment=R=>['Glass Loader','UV','EVA','Input Conveyor',...R.nums.flatMap(n=>[`Robot ${n}`,`Stringer ${n}A`,`Stringer ${n}B`,`Conveyor ${n}`])];let state={};try{state=JSON.parse(localStorage.getItem('stringerHeatMapV1')||'{}')}catch(e){}rows.forEach(R=>equipment(R).forEach(e=>{if(!state[K(R.l,R.r,e)])state[K(R.l,R.r,e)]='normal'}));const save=()=>localStorage.setItem('stringerHeatMapV1',JSON.stringify(state)),mk=(n,a,t)=>{const e=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(t!==undefined)e.textContent=t;return e},txt=(x,y,t,s=12,w=600,f='#eef4ff')=>map.appendChild(mk('text',{x,y,'text-anchor':'middle','font-family':'Arial','font-size':s,'font-weight':w,fill:f},t));function zone(l,r,e,x,y,w,h,label){const k=K(l,r,e),st=state[k];const z=mk('rect',{'data-key':k,class:'equip',x,y,width:w,height:h,rx:7,fill:colors[st],stroke:'#31415b','stroke-width':2});map.appendChild(z);txt(x+w/2,y+h/2+4,label,11,700,st==='attention'?'#111':'#fff')}function arrow(x1,y1,x2,y2){map.appendChild(mk('line',{x1,y1,x2,y2,stroke:'#9eabc0','stroke-width':2.5}))}function stringer(l,r,n,x,y){txt(x+110,y-7,`STRINGER ${n}`,10,700,'#9eabc0');zone(l,r,`Stringer ${n}A`,x,y,105,58,`${n}A`);zone(l,r,`Stringer ${n}B`,x+115,y,105,58,`${n}B`)}function current(){return K(+line.value,row.value,eq.value)}function showInfo(){info.textContent=`Selected: Line ${line.value} · ${row.value==='upper'?'Upper 7–12':'Lower 1–6'} · ${eq.value} · ${status.options[status.selectedIndex].text}`;document.querySelectorAll('[data-key]').forEach(e=>e.classList.toggle('selected',e.dataset.key===current()))}function populate(){const R=rows.find(v=>v.l===+line.value&&v.r===row.value),old=eq.value;eq.innerHTML='';equipment(R).forEach(e=>eq.add(new Option(e,e)));if([...eq.options].some(o=>o.value===old))eq.value=old;status.value=state[current()]||'normal';showInfo()}function draw(){map.innerHTML='';txt(55,165,'LINE',17,700);txt(55,200,'6',40,800);txt(55,715,'LINE',17,700);txt(55,750,'5',40,800);map.appendChild(mk('line',{x1:5,y1:550,x2:2925,y2:550,stroke:'#31415b','stroke-width':3,'stroke-dasharray':'12 10'}));txt(1460,558,'CENTRAL AISLE',12,700,'#9eabc0');rows.forEach(R=>{let x=105,y=R.y;[['Glass Loader',145],['UV',90],['EVA',90],['Input Conveyor',135]].forEach(([e,w])=>{zone(R.l,R.r,e,x,y+70,w,65,e==='Input Conveyor'?'Conveyor':e);arrow(x+w+3,y+102,x+w+20,y+102);x+=w+25});R.nums.forEach((n,i)=>{const sx=665+i*365,c=sx+125;if(R.r==='upper'){zone(R.l,R.r,`Conveyor ${n}`,sx,y,250,40,`CONVEYOR ${n}`);arrow(c,y+44,c,y+60);zone(R.l,R.r,`Robot ${n}`,sx+50,y+65,150,40,`ROBOT ${n}`);stringer(R.l,R.r,n,sx+15,y+125)}else{stringer(R.l,R.r,n,sx+15,y+12);zone(R.l,R.r,`Robot ${n}`,sx,y+82,250,40,`ROBOT ${n}`);arrow(c,y+126,c,y+142);zone(R.l,R.r,`Conveyor ${n}`,sx,y+148,250,40,`CONVEYOR ${n}`)}if(i<5)arrow(sx+255,y+102,sx+350,y+102)});txt(34,y+108,R.r==='upper'?'UPPER':'LOWER',9,700,'#9eabc0')});showInfo()}line.onchange=populate;row.onchange=populate;eq.onchange=()=>{status.value=state[current()]||'normal';showInfo()};status.onchange=showInfo;document.getElementById('apply').onclick=()=>{const k=current(),chosen=status.value;state[k]=chosen;save();draw();status.value=chosen;showInfo()};document.getElementById('reset').onclick=()=>{if(confirm('Reset every equipment status to Normal?')){Object.keys(state).forEach(k=>state[k]='normal');save();status.value='normal';draw()}};map.addEventListener('click',e=>{const z=e.target.closest('[data-key]');if(!z)return;const p=z.dataset.key.split('|');line.value=p[0].slice(1);row.value=p[1];populate();eq.value=p.slice(2).join('|');status.value=state[z.dataset.key]||'normal';showInfo()});populate();draw();save()})();</script></body></html>
